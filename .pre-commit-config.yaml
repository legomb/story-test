default_install_hook_types:
  - pre-commit
  - commit-msg

repos:
  - repo: local
    hooks:
      - id: validate-jsonschema
        name: Validate schema file
        entry: bash -c 'task validate:schemas'
        language: system
  # - repo: local
  #   hooks:
  #     - id: validate-examples
  #       name: Validate JSON schema and examples
  #       entry: bash -c 'task validate:examples'
  #       language: system
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
  # - repo: https://github.com/pre-commit/mirrors-prettier
  #   rev: v4.3.1
  #   hooks:
  #     - id: prettier
  #       args: ["--write"]
  - repo: local
    hooks:
      - id: apply-formatting
        name: Format files
        entry: bash -c 'devbox run task format:apply'
        language: system
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v2.1.1
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, ci, chore, docs, ref, test]
