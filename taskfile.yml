version: "3"

dotenv: [.env]

vars:
  SCHEMA_FILE: schemas/v1/tests.schema.json
  SAMPLE_FILE: test/the-tell-tale-heart.tests.yml
  STORY_FILE: test/the-tell-tale-heart.md
  EXAMPLES_DIR: test

tasks:
  default:
    desc: List tasks (default)
    cmds:
      - cmd: task -l
        silent: true

  pre-commit:install:
    desc: Install pre-commit hooks
    cmds:
      - pre-commit install -f

  pre-commit:run:
    desc: Run pre-commit hooks on all files
    cmds:
      - pre-commit run --all-files

  format:apply:
    desc: "Format all files with Prettier"
    cmds:
      - prettier --write .

  format:check:
    desc: "Check formatting without writing"
    cmds:
      - prettier --check .

  test:all:
    desc: Run unit tests and the sample story test
    deps:
      - test:schemas:validate:story-tests-schema
      - test:schemas:validate:example-schemas
      - test:unit
      - test:example-story

  test:ci:
    desc: Run CI checks without requiring Ollama
    deps:
      - test:schemas:validate:story-tests-schema
      - test:schemas:validate:example-schemas
      - test:unit
      - format:check

  test:unit:
    desc: Run Python unit tests
    cmds:
      - python -m pytest

  test:example-story:
    desc: Run the Tell-Tale Heart assertions with Ollama
    cmds:
      - story-test {{.SAMPLE_FILE}} {{.STORY_FILE}}

  test:example-story:claude:
    desc: Run the Tell-Tale Heart assertions with Claude
    requires:
      vars: [ANTHROPIC_API_KEY]
    cmds:
      - |
        story-test \
        {{.SAMPLE_FILE}} \
        {{.STORY_FILE}} \
        --provider anthropic \
        --model claude-opus-5-5

  test:example-story:strict:
    desc: Run the Tell-Tale Heart assertions and fail on failed tests
    cmds:
      - story-test {{.SAMPLE_FILE}} {{.STORY_FILE}} --fail-on-test-failure

  test:schemas:validate:story-tests-schema:
    desc: Validate JSON schema to check if it's valid JSON
    cmds:
      - echo "🔍 Checking {{.SCHEMA_FILE}} is valid JSON"
      - jq empty {{.SCHEMA_FILE}}

  test:schemas:validate:example-schemas:
    desc: Validate JSON examples against schema
    cmds:
      # - jsonschema -i {{.SAMPLE_FILE}} {{.SCHEMA_FILE}}
      - echo "🧩 Validating data files against schema"
      - |
        for f in {{.EXAMPLES_DIR}}/**.yml; do
          echo "  → $f"
          check-jsonschema --schemafile {{.SCHEMA_FILE}} "$f" || exit 1
        done
      - echo "✅ All JSON files are valid"

  environment:dev:install:
    desc: "Installs dependencies for dev environment"
    cmds:
      - python -m pip install -e .
      - python -m pip install -r requirements-dev.txt

  package:install:
    desc: "Install the story-test CLI into the active Python environment"
    cmds:
      - python -m pip install .

  package:install:local:
    desc: "Install the CLI and configured Ollama model for local use"
    cmds:
      - sh install.sh

  package:build:
    desc: "Build wheel and source distribution archives"
    cmds:
      - rm -rf build dist *.egg-info src/*.egg-info src/story_test.egg-info
      - python -m build

  package:check:
    desc: "Build and validate distribution archives"
    deps:
      - package:build
    cmds:
      - python -m twine check dist/*

  environment:ollama:install:
    desc: "Pull the configured Ollama model"
    cmds:
      - ollama pull "${OLLAMA_MODEL:-qwen3:8b}"

  tools:ollama:run:
    desc: "Runs Ollama"
    internal: true
    vars:
      OLLAMA_ARGS: ""
    cmds:
      - ollama {{.OLLAMA_ARGS}} {{.CLI_ARGS}}

  tools:ollama:run:interactive:
    desc: "Runs Ollama in interactive mode"
    cmds:
      - task: tools:ollama:run
