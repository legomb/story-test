version: "3"

vars:
  SCHEMA_FILE: schemas/v1/tests.schema.json
  SAMPLE_FILE: examples/the-tell-tale-heart/the-tell-tale-heart.tests.yml
  STORY_FILE: examples/the-tell-tale-heart/the-tell-tale-heart.md
  EXAMPLES_DIR: examples

tasks:
  default:
    desc: List tasks (default)
    cmds:
      - cmd: task -l
        silent: true

  validate:schemas:
    desc: Validate JSON schema to check if it's valid JSON
    cmds:
      - echo "🔍 Checking {{.SCHEMA_FILE}} is valid JSON"
      - jq empty {{.SCHEMA_FILE}}

  validate:examples:
    desc: Validate JSON examples against schema
    cmds:
      # - jsonschema -i {{.SAMPLE_FILE}} {{.SCHEMA_FILE}}
      - echo "🧩 Validating data files against schema"
      - |
        for f in {{.EXAMPLES_DIR}}/*.yaml; do
          echo "  → $f"
          check-jsonschema --schemafile {{.SCHEMA_FILE}} "$f" || exit 1
        done
      - echo "✅ All JSON files are valid"

  pre-commit:install:
    desc: Install pre-commit hooks
    cmds:
      - pre-commit install

  pre-commit:run:
    desc: Run pre-commit hooks on all files
    cmds:
      - pre-commit run --all-files

  format:apply:
    desc: "Format all files with Prettier"
    cmds:
      - prettier --write .

  format:check:
    desc: "Check formatting without writing"
    cmds:
      - prettier --check .

  test:
    desc: Run unit tests and the sample story test
    deps:
      - test:unit
      - test:story

  test:unit:
    desc: Run Python unit tests
    cmds:
      - python -m pytest story-test/test_story_test.py

  test:story:
    desc: Run the Tell-Tale Heart assertions with Laya
    cmds:
      - python story-test/story_test.py {{.SAMPLE_FILE}} {{.STORY_FILE}}

  environment:dev:install:
    desc: "Installs dependencies for dev environment"
    cmds:
      - python -m pip install -r story-test/requirements-dev.txt

  tools:laya:run:
    desc: "Runs laya"
    internal: true
    cmds:
      - laya

  tools:laya:run:interactive:
    desc: "Runs laya in interactive mode"
    cmds:
      - laya
