tests:
  - name: author
    assertion: The story was written by Edgar Allan Poe.
  - name: narrator-reliability
    assertion: The narrator insists that he is not mad.
  - name: victim
    assertion: The narrator kills an old man.
  - name: motive
    assertion: The narrator kills the old man because he wants the old man's gold.
  - name: confession
    assertion: The narrator confesses after believing he can hear the dead man's beating heart.
