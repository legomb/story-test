[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "story-test"
version = "2.2.0"
description = "Evaluate story assertions with hosted or local AI models."
readme = "README.md"
requires-python = ">=3.12"
authors = [{name = "legomb"}]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
]
dependencies = [
  "anthropic>=0.40",
  "jsonschema>=4.0",
  "ollama>=0.6",
  "openai>=1.50",
  "PyYAML>=6.0",
]

[project.scripts]
story-test = "story_test:main"

[project.urls]
Homepage = "https://github.com/legomb/story-test"
Issues = "https://github.com/legomb/story-test/issues"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["story_test"]

[tool.setuptools.data-files]
"share/story-test/schemas/v1" = ["schemas/v1/tests.schema.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
