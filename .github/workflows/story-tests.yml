name: Story tests

on:
  push:
    paths:
      - "examples/**"
      - "schemas/**"
      - "src/**"
      - "test/**"
      - "requirements*.txt"
      - "taskfile.yml"
      - ".github/workflows/story-tests.yml"
  pull_request:
    paths:
      - "examples/**"
      - "schemas/**"
      - "src/**"
      - "test/**"
      - "requirements*.txt"
      - "taskfile.yml"
      - ".github/workflows/story-tests.yml"

jobs:
  story-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Devbox
        uses: jetify-com/devbox-install-action@v0.12.0

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Install Python dependencies
        run: devbox run task environment:dev:install

      - name: Start Ollama
        run: ollama serve > /tmp/ollama.log 2>&1 &

      - name: Pull Qwen model
        run: devbox run task environment:ollama:install

      - name: Run strict story tests
        run: devbox run task test:example-story:strict
