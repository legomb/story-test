name: Create release

on:
  push:
    branches:
      - main
    # paths:
    #   - "schemas/v1/tests.schema.json" # only run when this file changes
  workflow_run:
    workflows: ["Valid Schema files"]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag for release"
        required: false
        default: "latest"

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  create-release:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install semantic-release github plugin
        run: npm install @semantic-release/github

      - name: Generate dummy semantic-release config
        run: |
          cat > package.json <<'EOF'
          {
            "name": "temp-cv-release",
            "version": "0.0.0"
          }
          EOF

          cat > .releaserc.json <<'EOF'
          {
            "plugins": [["@semantic-release/github"]]
          }
          EOF

      - name: Create Release
        uses: cycjimmy/semantic-release-action@v4
        with:
          semantic_version: 23
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
